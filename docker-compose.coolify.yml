name: opengym

services:
  media:
    image: alpine/git
    restart: "no"
    volumes:
      - opengym-media-img:/out/img
      - opengym-media-gif:/out/gif
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$(ls -A /out/img 2>/dev/null)" ]; then
          echo "Downloading exercise media..."
          git clone --depth 1 \
            https://github.com/hasaneyldrm/exercises-dataset \
            /tmp/ds

          cp /tmp/ds/images/*.jpg /out/img/
          cp /tmp/ds/videos/*.gif /out/gif/

          echo "Exercise media ready."
        else
          echo "Exercise media already present."
        fi

  api:
    build:
      context: ./api
      target: ${API_TARGET:-default}
    image: opengym-api-local
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3000}
      DATA_DIR: /data
      TRUST_PROXY: ${TRUST_PROXY:-1}
      RP_ID: ${RP_ID}
      ORIGIN: ${ORIGIN}
      RP_NAME: ${RP_NAME:-openGym}
      SESSION_DAYS: ${SESSION_DAYS:-90}
      ADMIN_UIDS: ${ADMIN_UIDS:-}
      INVITE_ONLY: ${INVITE_ONLY:-1}
      ALLOW_GUEST: ${ALLOW_GUEST:-0}
      PASSWORD_LOGIN: ${PASSWORD_LOGIN:-0}
      AUDIT_LOG: ${AUDIT_LOG:-1}
      AUDIT_MAX: ${AUDIT_MAX:-5000}
      AUDIT_DAYS: ${AUDIT_DAYS:-90}
      AUDIT_IP: ${AUDIT_IP:-net}
      DEFAULT_LANG: ${DEFAULT_LANG:-en}
      COACH_DISABLED: ${COACH_DISABLED:-}
    volumes:
      - opengym-data:/data
      - opengym-coach-auth:/coach-auth
    networks:
      - opengym-internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://127.0.0.1:3000/api/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s


  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: opengym-web-local
    restart: unless-stopped
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_started
    environment:
      NGINX_PORT: 80
      BACKEND: api
      PORT: 3000
      RESOLVER: 127.0.0.11
      BASE_PATH: ${BASE_PATH:-}
      MEDIA_UPLOAD_MAX: ${MEDIA_UPLOAD_MAX:-48m}
      CF_CONNECTING_IP: ${CF_CONNECTING_IP:-}
    volumes:
      - opengym-media-img:/usr/share/nginx/html/img:ro
      - opengym-media-gif:/usr/share/nginx/html/gif:ro
    networks:
      - opengym-internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://127.0.0.1:80/ || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s


networks:
  opengym-internal:


volumes:
  opengym-data:
  opengym-coach-auth:
  opengym-media-img:
  opengym-media-gif: